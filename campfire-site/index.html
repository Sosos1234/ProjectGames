<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Горящий костер</title>
  <style>
    :root {
      --night-1: #02030b;
      --night-2: #090f21;
      --night-3: #111a33;
      --ground-1: #18120f;
      --ground-2: #0f0c0a;
      --ember-1: #ffcb4f;
      --ember-2: #ff8a28;
      --ember-3: #ff5823;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #fef6d8;
      background:
        radial-gradient(circle at 70% -10%, rgba(101, 121, 255, 0.22), transparent 45%),
        radial-gradient(circle at 20% -15%, rgba(87, 119, 255, 0.2), transparent 50%),
        linear-gradient(to bottom, #03040d 0%, #060a17 40%, #0c1428 65%, #0a121d 100%);
    }

    body {
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .scene {
      position: relative;
      width: min(980px, 95vw);
      height: min(680px, 88vh);
      overflow: hidden;
      border-radius: 28px;
      background:
        radial-gradient(circle at 18% 16%, rgba(255, 255, 255, 0.22) 1px, transparent 2px) 0 0/130px 130px,
        radial-gradient(circle at 67% 28%, rgba(255, 255, 255, 0.15) 1px, transparent 2px) 0 0/180px 180px,
        radial-gradient(circle at 88% 45%, rgba(255, 255, 255, 0.12) 1px, transparent 2px) 0 0/160px 160px,
        linear-gradient(to bottom, var(--night-1) 0%, var(--night-2) 42%, var(--night-3) 100%);
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.65),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      isolation: isolate;
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center 82%, rgba(255, 151, 49, 0.13), transparent 48%);
      pointer-events: none;
    }

    .moon {
      position: absolute;
      top: 64px;
      right: 115px;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 32%, #fffde1, #ffeab0 58%, #ffc86f 100%);
      box-shadow:
        0 0 28px rgba(255, 221, 133, 0.8),
        0 0 80px rgba(255, 205, 116, 0.32);
      opacity: 0.9;
      z-index: 1;
    }

    .moon::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 70% 20%, rgba(255, 230, 178, 0.56), rgba(255, 227, 161, 0));
    }

    .mountains {
      position: absolute;
      left: -5%;
      width: 110%;
      border-radius: 50%;
      filter: blur(1px);
      z-index: 1;
    }

    .mountains.back {
      bottom: 200px;
      height: 280px;
      background:
        radial-gradient(ellipse at 15% 100%, #16223e 0%, #0f1a33 55%, transparent 58%),
        radial-gradient(ellipse at 42% 100%, #1a2745 0%, #121e38 56%, transparent 59%),
        radial-gradient(ellipse at 70% 100%, #14203b 0%, #0d1830 58%, transparent 60%),
        radial-gradient(ellipse at 93% 100%, #182847 0%, #101d36 56%, transparent 58%);
      opacity: 0.85;
    }

    .mountains.front {
      bottom: 136px;
      height: 260px;
      background:
        radial-gradient(ellipse at 8% 100%, #101a2f 0%, #0a1428 60%, transparent 62%),
        radial-gradient(ellipse at 36% 100%, #111b31 0%, #0a1426 61%, transparent 63%),
        radial-gradient(ellipse at 61% 100%, #0f192f 0%, #091224 61%, transparent 63%),
        radial-gradient(ellipse at 87% 100%, #121d35 0%, #0a1529 60%, transparent 63%);
      opacity: 0.94;
    }

    .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 220px;
      background:
        radial-gradient(ellipse at center top, rgba(255, 128, 43, 0.2) 0%, rgba(255, 128, 43, 0) 52%),
        linear-gradient(to bottom, var(--ground-1), var(--ground-2));
      z-index: 2;
    }

    .hero-copy {
      position: absolute;
      left: clamp(18px, 5vw, 56px);
      top: clamp(20px, 6vw, 64px);
      width: min(470px, 68vw);
      z-index: 4;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: clamp(12px, 1.6vw, 15px);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 236, 196, 0.86);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 64px);
      line-height: 0.95;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 16px 0 0;
      font-size: clamp(15px, 2.3vw, 20px);
      line-height: 1.45;
      max-width: 38ch;
      color: rgba(255, 244, 220, 0.9);
    }

    .campfire {
      position: absolute;
      left: 50%;
      bottom: 22px;
      width: 420px;
      height: 340px;
      transform: translateX(-50%);
      z-index: 5;
      pointer-events: none;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
    }

    .fire-glow {
      position: absolute;
      left: 50%;
      bottom: 58px;
      width: 245px;
      height: 145px;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(ellipse at center, rgba(255, 198, 96, 0.55) 0%, rgba(255, 147, 48, 0.28) 42%, rgba(255, 99, 20, 0.05) 72%, transparent 100%);
      filter: blur(6px);
      animation: glow 2.2s ease-in-out infinite;
    }

    .stones {
      position: absolute;
      left: 50%;
      bottom: 30px;
      width: 300px;
      height: 150px;
      margin: 0;
      padding: 0;
      list-style: none;
      transform: translateX(-50%);
    }

    .stones li {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 44px;
      height: 23px;
      border-radius: 50%;
      background: linear-gradient(to bottom, #7a7777, #4f4d4d);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.18),
        0 2px 6px rgba(0, 0, 0, 0.4);
      transform:
        translate(-50%, -50%)
        rotate(calc(var(--i) * 30deg))
        translate(0, -63px)
        scale(0.92);
      opacity: 0.95;
    }

    .stones li:nth-child(odd) {
      transform:
        translate(-50%, -50%)
        rotate(calc(var(--i) * 30deg))
        translate(0, -63px)
        scale(1.04);
    }

    .log {
      position: absolute;
      left: 50%;
      bottom: 72px;
      width: 210px;
      height: 30px;
      border-radius: 16px;
      transform-origin: center;
      background:
        repeating-linear-gradient(
          90deg,
          #5c341a 0 12px,
          #6f3f1f 12px 24px
        );
      box-shadow:
        inset 0 -8px 10px rgba(0, 0, 0, 0.32),
        inset 0 4px 6px rgba(255, 179, 109, 0.15),
        0 10px 18px rgba(0, 0, 0, 0.35);
    }

    .log::before,
    .log::after {
      content: "";
      position: absolute;
      top: 6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle, #825131 20%, #5b311b 70%, #3b2011 100%);
    }

    .log::before {
      left: 6px;
    }

    .log::after {
      right: 6px;
    }

    .log.left {
      transform: translateX(-50%) rotate(19deg);
    }

    .log.right {
      transform: translateX(-50%) rotate(-18deg);
    }

    .embers {
      position: absolute;
      left: 50%;
      bottom: 88px;
      width: 170px;
      height: 58px;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(ellipse at center, rgba(255, 212, 120, 0.92) 0%, rgba(255, 166, 58, 0.86) 35%, rgba(255, 90, 21, 0.68) 62%, rgba(255, 77, 12, 0.02) 100%);
      filter: blur(0.2px);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .flames {
      position: absolute;
      left: 50%;
      bottom: 94px;
      width: 185px;
      height: 230px;
      transform: translateX(-50%);
      filter: drop-shadow(0 0 18px rgba(255, 156, 62, 0.45));
    }

    .flame {
      position: absolute;
      bottom: 0;
      border-radius: 52% 52% 45% 45%;
      transform-origin: center bottom;
      background: radial-gradient(circle at 50% 72%, var(--ember-1) 0%, var(--ember-2) 44%, var(--ember-3) 74%, rgba(255, 75, 18, 0.2) 100%);
      mix-blend-mode: screen;
      animation: flicker var(--duration) ease-in-out infinite;
    }

    .flame::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 14%;
      width: 42%;
      height: 45%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 250, 215, 0.94), rgba(255, 242, 198, 0.35) 55%, rgba(255, 255, 255, 0) 80%);
      filter: blur(1px);
    }

    .flame.one {
      left: 50%;
      width: 74px;
      height: 190px;
      transform: translateX(-50%);
      --duration: 1.5s;
      z-index: 4;
    }

    .flame.two {
      left: 14%;
      width: 58px;
      height: 150px;
      --duration: 1.25s;
      animation-delay: -0.35s;
      opacity: 0.92;
    }

    .flame.three {
      right: 11%;
      width: 56px;
      height: 144px;
      --duration: 1.3s;
      animation-delay: -0.55s;
      opacity: 0.9;
    }

    .flame.four {
      left: 33%;
      width: 44px;
      height: 116px;
      --duration: 1.15s;
      animation-delay: -0.25s;
      opacity: 0.85;
    }

    .flame.five {
      right: 32%;
      width: 40px;
      height: 104px;
      --duration: 1.08s;
      animation-delay: -0.42s;
      opacity: 0.84;
    }

    .sparks,
    .smoke {
      position: absolute;
      left: 50%;
      bottom: 98px;
      width: 240px;
      height: 260px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .spark {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: radial-gradient(circle, #fff9d5 0%, #ffd96a 36%, #ff8e2b 78%, rgba(255, 142, 43, 0) 100%);
      opacity: 0;
      animation: spark-rise var(--duration) linear infinite;
      animation-delay: var(--delay);
      filter: drop-shadow(0 0 4px rgba(255, 190, 80, 0.8));
    }

    .smoke .puff {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: var(--size);
      height: calc(var(--size) * 0.72);
      margin-left: calc(var(--size) * -0.5);
      border-radius: 50%;
      background: radial-gradient(ellipse at 40% 40%, rgba(211, 218, 235, 0.3), rgba(153, 166, 188, 0.08) 65%, rgba(132, 145, 166, 0));
      filter: blur(1.2px);
      opacity: 0;
      animation: smoke-rise var(--duration) ease-out infinite;
      animation-delay: var(--delay);
    }

    .credits {
      position: absolute;
      right: 18px;
      bottom: 14px;
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 240, 207, 0.65);
      z-index: 6;
    }

    @keyframes flicker {
      0%,
      100% {
        transform: translateY(0) scale(0.98, 1);
      }
      30% {
        transform: translate(-1px, -10px) scale(1.05, 0.96);
      }
      55% {
        transform: translate(1px, -16px) scale(0.94, 1.06);
      }
      78% {
        transform: translate(0, -7px) scale(1.02, 0.97);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        transform: translateX(-50%) scale(0.97);
        opacity: 0.9;
      }
      50% {
        transform: translateX(-50%) scale(1.06);
        opacity: 1;
      }
    }

    @keyframes glow {
      0%,
      100% {
        transform: translateX(-50%) scale(0.97);
        opacity: 0.72;
      }
      50% {
        transform: translateX(-50%) scale(1.05);
        opacity: 0.96;
      }
    }

    @keyframes spark-rise {
      0% {
        transform: translate(0, 0) scale(0.8);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      70% {
        opacity: 0.95;
      }
      100% {
        transform: translate(var(--drift), calc(-1 * var(--height))) scale(0.15);
        opacity: 0;
      }
    }

    @keyframes smoke-rise {
      0% {
        transform: translate(0, 0) scale(0.72);
        opacity: 0;
      }
      18% {
        opacity: 0.38;
      }
      100% {
        transform: translate(var(--drift), calc(-1 * var(--height))) scale(1.35);
        opacity: 0;
      }
    }

    @media (max-width: 740px) {
      .scene {
        height: min(700px, 94vh);
      }

      .hero-copy {
        width: 88%;
      }

      .campfire {
        transform: translateX(-50%) scale(0.88);
        bottom: -2px;
      }

      .moon {
        right: 42px;
        width: 82px;
        height: 82px;
      }

      .credits {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="moon"></div>
    <div class="mountains back"></div>
    <div class="mountains front"></div>
    <div class="ground"></div>

    <section class="hero-copy">
      <p class="eyebrow">Ночная атмосфера</p>
      <h1>Горящий костер</h1>
      <p class="subtitle">
        Небольшой атмосферный сайт: тишина ночного леса, тепло пламени,
        мягкое свечение углей и живые искры, взлетающие в темноту.
      </p>
    </section>

    <div class="campfire" aria-hidden="true">
      <div class="fire-glow"></div>

      <ul class="stones">
        <li style="--i:0"></li>
        <li style="--i:1"></li>
        <li style="--i:2"></li>
        <li style="--i:3"></li>
        <li style="--i:4"></li>
        <li style="--i:5"></li>
        <li style="--i:6"></li>
        <li style="--i:7"></li>
        <li style="--i:8"></li>
        <li style="--i:9"></li>
        <li style="--i:10"></li>
        <li style="--i:11"></li>
      </ul>

      <div class="log left"></div>
      <div class="log right"></div>
      <div class="embers"></div>

      <div class="flames">
        <span class="flame one"></span>
        <span class="flame two"></span>
        <span class="flame three"></span>
        <span class="flame four"></span>
        <span class="flame five"></span>
      </div>

      <div class="smoke" id="smoke"></div>
      <div class="sparks" id="sparks"></div>
    </div>

    <p class="credits">Campfire Scene</p>
  </main>

  <script>
    const sparksRoot = document.getElementById("sparks");
    const smokeRoot = document.getElementById("smoke");

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    for (let i = 0; i < 34; i += 1) {
      const spark = document.createElement("span");
      spark.className = "spark";
      spark.style.setProperty("--size", `${random(2, 6).toFixed(2)}px`);
      spark.style.setProperty("--duration", `${random(1.7, 3.7).toFixed(2)}s`);
      spark.style.setProperty("--delay", `${random(-4, 0).toFixed(2)}s`);
      spark.style.setProperty("--drift", `${random(-110, 110).toFixed(1)}px`);
      spark.style.setProperty("--height", `${random(180, 310).toFixed(0)}px`);
      sparksRoot.appendChild(spark);
    }

    for (let i = 0; i < 12; i += 1) {
      const puff = document.createElement("span");
      puff.className = "puff";
      puff.style.setProperty("--size", `${random(30, 64).toFixed(1)}px`);
      puff.style.setProperty("--duration", `${random(5.2, 8.8).toFixed(2)}s`);
      puff.style.setProperty("--delay", `${random(-7, 0).toFixed(2)}s`);
      puff.style.setProperty("--drift", `${random(-80, 82).toFixed(1)}px`);
      puff.style.setProperty("--height", `${random(190, 305).toFixed(0)}px`);
      smokeRoot.appendChild(puff);
    }
  </script>
</body>
</html>
